<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <path id="petal" d="M300 92 C330 142 330 202 300 252 C270 202 270 142 300 92 Z"/>
    <circle id="dot" cx="300" cy="66" r="3.2"/>
  </defs>

  <!-- inner rings -->
  <g fill="none" stroke="#ff9933" stroke-width="1.2">
    <circle cx="300" cy="300" r="150"/>
    <circle cx="300" cy="300" r="204"/>
  </g>

  <!-- twelve lotus petals -->
  <g fill="none" stroke="#ff9933" stroke-width="1.2">
    <use href="#petal" transform="rotate(0 300 300)"/>
    <use href="#petal" transform="rotate(30 300 300)"/>
    <use href="#petal" transform="rotate(60 300 300)"/>
    <use href="#petal" transform="rotate(90 300 300)"/>
    <use href="#petal" transform="rotate(120 300 300)"/>
    <use href="#petal" transform="rotate(150 300 300)"/>
    <use href="#petal" transform="rotate(180 300 300)"/>
    <use href="#petal" transform="rotate(210 300 300)"/>
    <use href="#petal" transform="rotate(240 300 300)"/>
    <use href="#petal" transform="rotate(270 300 300)"/>
    <use href="#petal" transform="rotate(300 300 300)"/>
    <use href="#petal" transform="rotate(330 300 300)"/>
  </g>

  <!-- gold outer ring -->
  <g fill="none" stroke="#f6c453" stroke-width="1" opacity="0.9">
    <circle cx="300" cy="300" r="258"/>
  </g>

  <!-- green bead ring -->
  <g fill="#19a463" opacity="0.9">
    <use href="#dot" transform="rotate(0 300 300)"/>
    <use href="#dot" transform="rotate(15 300 300)"/>
    <use href="#dot" transform="rotate(30 300 300)"/>
    <use href="#dot" transform="rotate(45 300 300)"/>
    <use href="#dot" transform="rotate(60 300 300)"/>
    <use href="#dot" transform="rotate(75 300 300)"/>
    <use href="#dot" transform="rotate(90 300 300)"/>
    <use href="#dot" transform="rotate(105 300 300)"/>
    <use href="#dot" transform="rotate(120 300 300)"/>
    <use href="#dot" transform="rotate(135 300 300)"/>
    <use href="#dot" transform="rotate(150 300 300)"/>
    <use href="#dot" transform="rotate(165 300 300)"/>
    <use href="#dot" transform="rotate(180 300 300)"/>
    <use href="#dot" transform="rotate(195 300 300)"/>
    <use href="#dot" transform="rotate(210 300 300)"/>
    <use href="#dot" transform="rotate(225 300 300)"/>
    <use href="#dot" transform="rotate(240 300 300)"/>
    <use href="#dot" transform="rotate(255 300 300)"/>
    <use href="#dot" transform="rotate(270 300 300)"/>
    <use href="#dot" transform="rotate(285 300 300)"/>
    <use href="#dot" transform="rotate(300 300 300)"/>
    <use href="#dot" transform="rotate(315 300 300)"/>
    <use href="#dot" transform="rotate(330 300 300)"/>
    <use href="#dot" transform="rotate(345 300 300)"/>
  </g>

  <g fill="none" stroke="#19a463" stroke-width="1">
    <circle cx="300" cy="300" r="280"/>
  </g>
</svg>
